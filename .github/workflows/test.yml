name: Verify and Deliver

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: verify-deliver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Verify exact commit
    uses: ./.github/workflows/verification.yml

  deploy:
    name: Deploy verified commit
    if: github.event_name == 'push'
    needs: verification
    uses: ./.github/workflows/deploy.yml
    with:
      commit_sha: ${{ github.sha }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit

  release:
    name: Release verified main commit
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: verification
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      commit_sha: ${{ github.sha }}
      verification_passed: true
    secrets: inherit
