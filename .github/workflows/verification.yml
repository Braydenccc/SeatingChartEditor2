name: Reusable Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Docs, version, types and Vitest
    runs-on: windows-latest

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check agent documentation
        run: npm run docs:check

      - name: Check synchronized release version
        run: npm run version:check

      - name: Run type check
        run: npm run type-check

      - name: Run Vitest with core coverage gate
        run: npm run test:ci

      - name: Test safe test-environment build wrapper
        run: npm run test:build-test

      - name: Test safe deployment ordering
        run: node --test test-scr/deploy-staging.test.js

      - name: Test safe main deployment wrapper
        run: npm run test:deploy-main

      - name: Test PHP security source contracts
        run: node --test test-scr/php-security-source-contract.test.js

  e2e:
    name: Playwright browser workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run test:e2e

      - name: Archive browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/e2e/
          if-no-files-found: ignore
          retention-days: 30

  php-contract:
    name: Retinbox PHP ${{ matrix.php-version }} lint and contract fixture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.2', '8.2']

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint Retinbox PHP functions
        shell: bash
        run: find public/api -type f -name '*.php' -print0 | sort -z | xargs -0 -r -n 1 php -l

      - name: Run offline PHP security contract fixture
        working-directory: public
        run: php ../test-scr/security-contract-fixture.php

      - name: Run DAV proxy PHP contract fixture
        working-directory: public
        run: php ../test-scr/dav-proxy-security-contract-fixture.php

      - name: Run debug guard PHP contract fixture
        working-directory: public
        run: php ../test-scr/debug-guard-contract-fixture.php

  tauri-check:
    name: Tauri cargo check
    runs-on: windows-latest

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check Tauri crate
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
