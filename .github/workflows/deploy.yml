name: Deploy to Retinbox Web Hosting

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact verified commit to deploy
        required: true
        type: string
      ref_name:
        description: Source branch that selects the deployment target
        required: true
        type: string
    secrets:
      RTH_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ${{ inputs.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure deployment target
        shell: bash
        env:
          DEPLOY_REF_NAME: ${{ inputs.ref_name }}
        run: |
          case "$DEPLOY_REF_NAME" in
            main)
              echo "BUILD_SCRIPT=build:web" >> "$GITHUB_ENV"
              echo "DEPLOY_ENVIRONMENT=production" >> "$GITHUB_ENV"
              echo "DEPLOY_SITE=sce.jbyc.cc" >> "$GITHUB_ENV"
              echo "DEPLOY_URL=https://sce.jbyc.cc" >> "$GITHUB_ENV"
              ;;
            dev)
              echo "BUILD_SCRIPT=build:test" >> "$GITHUB_ENV"
              echo "DEPLOY_ENVIRONMENT=test" >> "$GITHUB_ENV"
              echo "DEPLOY_SITE=testsce.jbyc.cc" >> "$GITHUB_ENV"
              echo "DEPLOY_URL=https://testsce.jbyc.cc" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported branch: $DEPLOY_REF_NAME" >&2
              exit 1
              ;;
          esac

      - name: Prepare timestamp release version
        run: node scripts/set-release-version.js --timestamp "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" --github-env

      - name: Build
        run: npm run "$BUILD_SCRIPT"

      - name: Deploy
        env:
          RTH_API_KEY: ${{ secrets.RTH_API_KEY }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/deploy-staging.js --site "$DEPLOY_SITE" --outdir dist; then
              echo "Deployed ${DEPLOY_ENVIRONMENT} to ${DEPLOY_URL}"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deploy attempt ${attempt} failed, retrying in 15s..."
              sleep 15
            fi
          done

          echo "Deploy failed after 3 attempts." >&2
          exit 1

      - name: Show deployed URL
        run: |
          echo "Deployed URL: $DEPLOY_URL"
